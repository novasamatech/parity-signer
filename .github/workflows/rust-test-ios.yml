name: Rust backend test for ios

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  check:
    name: Cargo test on macOS
    runs-on: macos-26
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          # The default `opencv` formula is OpenCV 5 now, which the pinned opencv
          # crate cannot bind. Stay on the OpenCV 4 line the Linux jobs use.
          brew install opencv@4
          echo "PKG_CONFIG_PATH=$(brew --prefix opencv@4)/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-nextest
        uses: baptiste0928/cargo-install@b687c656bda5733207e629b50a22bf68974a0305 # v3.3.2
        with:
          crate: cargo-nextest
          version: 0.9

      - name: Install uniffi_bindgen
        uses: baptiste0928/cargo-install@1cd874a5478fdca35d868ccc74640c5aabbb8f1b # v3.0.0
        with:
          crate: uniffi_bindgen
          version: 0.22.0 # Must be in sync with version in Cargo.toml
          # Without the crate's lockfile cargo resolves latest deps, which need a newer rustc
          locked: true

      - name: Rust Cache
        uses: Swatinem/rust-cache@27b8ea9368cf428f0bfe41b0876b1a7e809d9844 # v2.7.7
        with:
          workspaces: rust -> rust/target

      - name: cargo nextest
        shell: bash
        run: |
          cd rust
          export DYLD_FALLBACK_LIBRARY_PATH="$(xcode-select --print-path)/Toolchains/XcodeDefault.xctoolchain/usr/lib/"
          cargo nextest run --retries 2 --locked
