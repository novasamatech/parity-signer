name: Reusable workflow for testing Android app

on:
  workflow_call:

jobs:
  run-tests:
    name: Run android unit test
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/${{ github.repository }}/opencv-builder:4.11.0
    steps:
      - name: Checkout Sources
        uses: actions/checkout@v4

      - name: Install System Dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install uniffi_bindgen
        uses: baptiste0928/cargo-install@1cd874a5478fdca35d868ccc74640c5aabbb8f1b # v3.0.0
        with:
          crate: uniffi_bindgen
          version: 0.22.0 # Must be in sync with version in Cargo.toml
          # Without the crate's lockfile cargo resolves latest deps, which need a newer rustc
          locked: true

      - name: Install additional rust targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - name: Install Android Dependencies
        uses: ./.github/actions/install-android-dep

      - name: Rust Cache
        uses: Swatinem/rust-cache@27b8ea9368cf428f0bfe41b0876b1a7e809d9844 # v2.7.7
        with:
          workspaces: rust -> rust/target

      - name: Gradle Cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build
        run: |
          ./gradlew :android:testDebugUnitTest
