[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"

ignore = [
    "RUSTSEC-2024-0344",
    "RUSTSEC-2021-0139",
    "RUSTSEC-2024-0370",
    "RUSTSEC-2022-0061",
    "RUSTSEC-2022-0081",
    "RUSTSEC-2024-0384",
    "RUSTSEC-2024-0388",
    "RUSTSEC-2022-0080",
    "RUSTSEC-2025-0141",  # bincode unmaintained (via uniffi)
    "RUSTSEC-2025-0057",  # fxhash unmaintained (via sled)
    "RUSTSEC-2025-0119",  # number_prefix unmaintained (via indicatif)
    "RUSTSEC-2024-0436",  # paste unmaintained (via substrate/uniffi)
    "RUSTSEC-2025-0009",  # ring AES panic (via rustls; upgrade when jsonrpsee/rustls allow)
    "RUSTSEC-2025-0134",  # rustls-pemfile unmaintained (via rustls-native-certs)
    "RUSTSEC-2025-0055",  # tracing-subscriber ANSI injection (via substrate sp-tracing)
    "RUSTSEC-2025-0161",  # libsecp256k1 unmaintained (via definitions; no maintained drop-in yet)
    "RUSTSEC-2026-0009",  # time RFC 2822 parsing DoS; we only format. Fix (0.3.47) needs rustc 1.85, clippy is pinned to 1.84
    "RUSTSEC-2026-0258",  # h2 0.3 empty DATA frames; only via jsonrpsee 0.16 in the generate_message CLI, fixed only in h2 0.4
    "RUSTSEC-2026-0098",  # rustls-webpki 0.101 name constraints; only via jsonrpsee 0.16 in the generate_message CLI
    "RUSTSEC-2026-0099",  # rustls-webpki 0.101 wildcard name constraints; same path as above
    "RUSTSEC-2026-0104",  # rustls-webpki 0.101 CRL parsing panic; same path as above
]

[licenses]
version = 2
allow = []
confidence-threshold = 0.8

[licenses.private]
ignore = false
registries = [
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = [""]
gitlab = [""]
bitbucket = [""]
